name: Check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A tag can move at any time: look once a week.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/catalog.mjs check
